# Nightly backup: every night, a full copy of the production Convex data
# (every table, the sign-in accounts and the stored files), locked with the
# BACKUP_PASSWORD secret and kept as a download for 90 days. The repository
# is public, so the copy is never stored unlocked. Restoring: docs/BACKUPS.md.
name: Nightly backup

on:
  schedule:
    # 07:17 UTC = 03:17 in Curaçao and Santo Domingo, when nobody is working.
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Back up the cloud data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_BACKUP_KEY }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Check the secrets are set
        run: |
          [ -n "$CONVEX_DEPLOY_KEY" ] || { echo "::error::Missing GitHub secret CONVEX_BACKUP_KEY (docs/BACKUPS.md)."; exit 1; }
          # Never upload a copy that isn't locked.
          if [ "${#BACKUP_PASSWORD}" -lt 20 ]; then
            echo "::error::The GitHub secret BACKUP_PASSWORD is missing or shorter than 20 characters (docs/BACKUPS.md)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Copy the production data
        run: npx convex export --include-file-storage --path "$RUNNER_TEMP/backup.zip"
      - name: Lock the copy with the backup password
        id: lock
        run: |
          name="acervus-backup-$(date -u +%F)"
          mkdir -p "$RUNNER_TEMP/out"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --output "$RUNNER_TEMP/out/$name.zip.gpg" "$RUNNER_TEMP/backup.zip" 3<<<"$BACKUP_PASSWORD"
          rm -f "$RUNNER_TEMP/backup.zip"
          # Prove the locked copy opens with the password and is a whole ZIP.
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --output "$RUNNER_TEMP/check.zip" --decrypt "$RUNNER_TEMP/out/$name.zip.gpg" 3<<<"$BACKUP_PASSWORD"
          unzip -tq "$RUNNER_TEMP/check.zip"
          echo "Tables in this copy: $(unzip -l "$RUNNER_TEMP/check.zip" | grep -c 'documents.jsonl')"
          rm -f "$RUNNER_TEMP/check.zip"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lock.outputs.name }}
          path: ${{ runner.temp }}/out/${{ steps.lock.outputs.name }}.zip.gpg
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
